[project]
name = "overnightworks-tandem"
dynamic = ["version"]
description = "The fleet's shared Redis coordination for apps that run in several pods: a wake channel with resync, deadlines, leases and locks on Redis time"
authors = [{ name = "Flex0r (Felix Hummert)", email = "felix.hummert@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
keywords = ["redis", "pubsub", "wake", "deadlines", "coordination"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Typing :: Typed",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "overnightworks-logline>=0.3.0,<0.7",
    "redis>=5.3,<9",
]

[dependency-groups]
dev = [
    "overnightworks-logline",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7,<8",
    "pytest-xdist>=3.7,<4",
    "fakeredis[lua]>=2.35,<3",
    "ruff>=0.4,<1",
    "pyright>=1.1.414,<2",
    "deptry==0.25.1",
]

[project.urls]
Repository = "https://github.com/overnightworks/tandem"
Issues = "https://github.com/overnightworks/tandem/issues"
Releases = "https://github.com/overnightworks/tandem/releases"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "tandem.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tandem*"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logline.configure".msg = "tandem never configures logging; the host does (AGENTS.md, Rules)."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 100

[tool.pyright]
include = [
    "src/tandem",
    "tests",
]
pythonVersion = "3.14"

[tool.uv.sources]
overnightworks-logline = { git = "https://github.com/overnightworks/logline", tag = "v0.6.0", group = "dev" }

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/tandem/__init__.py" }]
