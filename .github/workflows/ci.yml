name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event.pull_request.number != null }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev # NOSONAR(S8541) the project builds itself from this checkout and --no-build refuses that while every dependency is a wheel in uv.lock

      - name: Static checks
        run: scripts/run_static_checks.sh

      - name: Tests against a throwaway Redis
        run: scripts/run_redis_tests.sh tests -q -n auto --cov=tandem --cov-report=xml --cov-report=term-missing:skip-covered

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

      - name: Build the distribution
        run: uv build --build-constraint .github/requirements-build.txt --require-hashes

  lowest-direct:
    name: lowest-direct
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-suffix: lowest-direct

      - name: Create the environment
        run: uv venv --python 3.14

      - name: Install the lowest declared versions
        run: uv pip install --resolution lowest-direct -e . --group dev # NOSONAR(S8541,S8544) the project builds itself from this checkout and lowest-direct resolves the declared floors on purpose so it has no lock

      - name: Install the declared logline floor
        run: uv pip install "overnightworks-logline @ git+https://github.com/overnightworks/logline@v0.3.0" # NOSONAR(S8541,S8544) logline is not on an index, so the floor the range declares comes from its git tag; the dev group's source pins the newer end

      - name: Tests against a throwaway Redis
        run: scripts/run_redis_tests.sh tests -q -n auto

  quality:
    name: quality
    needs: [checks, lowest-direct]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@505b0df999b4bab932aba53f3e3dea044066debe # v0.18.0
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
