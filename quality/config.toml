reason = "tests the suite's own TCP proxy (tests/support/proxy.py), which no src/tandem module owns"

[[layout.allow]]
path = "tests/test_check_key_literals.py"
rule = "test-layout"
reason = "drives scripts/check_key_literals.py, which is a repository script and no src/tandem module"
